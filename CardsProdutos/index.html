<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos-Loja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="vitrine-cards">

    <article class="card-produto card-escuro">
      <header class="cabecalho-card">
        <h2 class="titulo-card">Tênis hylane suede blue</h2>
      </header>

      <div class="moldura-imagem">
        <img src="img/Gemini_Generated_Image_nrinf0nrinf0nrin.jpg" alt="Bota Timberland Black Edition" class="imagem-card">
      </div>

      <div class="corpo-card">
        <div class="etiquetas">
          <span class="etiqueta-categoria">Rua</span>
          <span class="etiqueta-destaque">Estilo</span>
        </div>

        <hr class="divisoria-card">

        <footer class="rodape-card">
          <div class="bloco-preco">
            <span class="rotulo-preco">PREÇO</span>
            <span class="valor-preco">R$ 480,00</span>
          </div>
        </footer>
      </div>
    </article>

    <article class="card-produto card-dourado card-destaque">
      <header class="cabecalho-card">
        <h2 class="titulo-card">BOTA TIMBERLAND</h2>
      </header>

      <div class="moldura-imagem">
        <img src="img/Gemini_Generated_Image_riozguriozgurioz.jpg" alt="Bota Timberland 6-Inch Premium Wheat" class="imagem-card">
      </div>

      <div class="corpo-card">
        <div class="etiquetas">
          <span class="etiqueta-categoria">Trabalho</span>
          <span class="etiqueta-destaque">Estilo</span>
        </div>

        <hr class="divisoria-card">

        <footer class="rodape-card">
          <div class="bloco-preco">
            <span class="rotulo-preco">PREÇO</span>
            <span class="valor-preco">R$ 450,00</span>
          </div>
        </footer>
      </div>
    </article>

    <article class="card-produto card-cobre">
      <header class="cabecalho-card">
        <h2 class="titulo-card">Nike Shox NZ</h2>
      </header>

      <div class="moldura-imagem">
        <img src="img/Gemini_Generated_Image_wwbm36wwbm36wwbm.jpg" alt="Bota Timberland Rust Brown" class="imagem-card">
      </div>

      <div class="corpo-card">
        <div class="etiquetas">
          <span class="etiqueta-categoria">Esporte</span>
          <span class="etiqueta-destaque">Chave de Quebrada</span>
        </div>

        <hr class="divisoria-card">

        <footer class="rodape-card">
          <div class="bloco-preco">
            <span class="rotulo-preco">PREÇO</span>
            <span class="valor-preco">R$ 470,00</span>
          </div>
        </footer>
      </div>
    </article>

  </main>

</body>
</html>
